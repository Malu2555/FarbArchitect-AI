[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "farbarchitect-ai-backend"
version = "0.1.0"
description = "fabArchitect AI — stateless closed-loop multi-agent CAD simulation engine"
requires-python = ">=3.11"
dependencies = [
    "django>=5.0.0",
    "django-ninja>=1.1.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "httpx>0.27.0",
    "pydantic>=2.6.0",
]

[project.optional-dependencies]
dev = [
    "uvicorn>=0.30.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    # Modal CLI + SDK. Needed only to build/serve/deploy backend/modal_app.py
    # and to run scripts/check_modal_image.py. Deliberately absent from
    # requirements.txt: the deployed image is built *by* Modal, so shipping the
    # ~80 MB client inside it would be dead weight.
    "modal>=1.6.3,<2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
